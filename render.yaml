databases:
  - name: query-ai-db
    plan: free
    databaseName: query_ai
    user: query_ai

services:
  - type: web
    name: query-ai
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: query-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
